# 메이저맵 인스타 카드뉴스 — 평일 아침 자동 생성 → Supabase 저장 → 웹(인스타 스튜디오)에서 복사해 업로드
# 월·수·금 = 입시 브리핑 / 화·목 = 요즘 트렌드 (캐릿 소재 + 웹 리서치로 캐릿 밖 근거를 섞어서만 게시)
# 필요 Secrets: ANTHROPIC_API_KEY, NOTION_TOKEN, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
name: MM_Insta · 카드뉴스 생성

on:
  schedule:
    - cron: "0 21 * * 0-4" # 월~금 06:00 KST (UTC 전날 21:00)
  workflow_dispatch:
    inputs:
      date:
        description: "게시 날짜 YYYY-MM-DD (비우면 오늘 KST)"
        required: false
      page_id:
        description: "소재로 쓸 노션 페이지 id (비우면 자동 선택)"
        required: false

concurrency:
  group: mm-insta-${{ inputs.date || 'today' }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MM_Insta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: MM_Insta/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
      - name: 카드뉴스 생성 → Supabase 저장
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POST_DATE: ${{ inputs.date }}
          PAGE_ID: ${{ inputs.page_id }}
        run: |
          args=(--publish)
          [ -n "$POST_DATE" ] && args+=(--date "$POST_DATE")
          [ -n "$PAGE_ID" ] && args+=(--page "$PAGE_ID")
          python -m mm_insta.pipeline "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardnews-${{ github.run_id }}
          path: MM_Insta/out/
          if-no-files-found: ignore
